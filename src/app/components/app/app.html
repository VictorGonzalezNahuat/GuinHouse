<div class="app-layout">

  <div class="mesh-canvas" aria-hidden="true">
    <span class="mesh-orb orb-a"></span>
    <span class="mesh-orb orb-b"></span>
    <span class="mesh-orb orb-c"></span>
  </div>

  <!-- TOPBAR TIPO ISLA -->
  <header class="topbar-island">
    <div class="brand-section">
      <img src="assets/brand-logos.png" alt="Logo de la marca" class="brand-logo">
      <div class="brand-info">
        <span class="business-name">Nombre de la empresa</span>
        <span class="powered-by">potenciado por GuinHouse</span>
      </div>
    </div>

    <!-- Buscador Global -->
    <div class="topbar-search">
      <div class="search-input-wrapper">
        <img src="assets/icons/search-icon.png" alt="Buscar" class="search-icon">
        <input type="text" placeholder="Buscar módulos, productos... (⌘ + K)">
      </div>
    </div>

    <!-- Acciones Rápidas / Perfil -->
    <div class="topbar-actions">
      <div class="user-avatar" title="Usuario">U</div>
    </div>
  </header>

  <!-- CUERPO CON SIDEBAR Y STAGE ISLAS -->
  <div class="layout-body">
    <!-- SIDEBAR TIPO ISLA (Con clase colapsable) -->
    <aside class="sidebar-island" [class.collapsed]="isCollapsed">
      
      <div class="menu-group">
        <!-- HEADER EN LA MISMA FILA: TITULO + BOTÓN -->
        <div class="group-header">
          <span class="group-title">MÓDULOS</span>
          <button class="toggle-sidebar-btn" (click)="toggleSidebar()" [title]="isCollapsed ? 'Expandir' : 'Colapsar'">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.rotated]="isCollapsed">
              <path d="m15 18-6-6 6-6"/>
            </svg>
          </button>
        </div>

        <nav class="nav-menu">
          
          <a routerLink="/app/home" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Inicio' : ''">
            <img src="assets/icons/dashboard-icon.png" alt="Inicio" class="nav-icon">
            <span class="nav-text">Inicio</span>
          </a>
          <a routerLink="/app/inventario" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Inventario' : ''">
            <img src="assets/icons/inventory-icon.png" alt="Inventario" class="nav-icon">
            <span class="nav-text">Inventario</span>
          </a>
          <a routerLink="/app/compras" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Compras' : ''">
            <img src="assets/icons/compras-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Compras</span>
          </a>
          <a routerLink="/app/ventas" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Ventas' : ''">
            <img src="assets/icons/pos-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Ventas</span>
          </a>
          <a routerLink="/app/clientes" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Clientes' : ''">
            <img src="assets/icons/clientes-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Clientes</span>
          </a>
          <a routerLink="/app/proveedores" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Proveedores' : ''">
            <img src="assets/icons/proveedores-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Proveedores</span>
          </a>
          <a routerLink="/app/contabilidad" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Contabilidad' : ''">
            <img src="assets/icons/contabilidad-icon.png" alt="Contabilidad" class="nav-icon">
            <span class="nav-text">Contabilidad</span>
          </a>
          <a routerLink="/app/reportes" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Reportes' : ''">
            <img src="assets/icons/reportes-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Reportes</span>
          </a>
          <a routerLink="/app/caja" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Caja' : ''">
            <img src="assets/icons/caja-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Caja</span>
          </a>
          <a routerLink="/app/sucursales" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Sucursales' : ''">
            <img src="assets/icons/sucursales-icon.png" alt="POS" class="nav-icon">
            <span class="nav-text">Sucursales</span>
          </a>
        </nav>
      </div>

      <div class="menu-group">
        <span class="group-title">SISTEMA</span>
        <nav class="nav-menu">
          <a routerLink="/app/usuarios" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Usuarios' : ''">
            <img src="assets/icons/users-icon.png" alt="Usuarios" class="nav-icon">
            <span class="nav-text">Usuarios</span>
          </a>
          <a routerLink="/app/configuracion" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? 'Configuración' : ''">
            <img src="assets/icons/settings-icon.png" alt="Configuración" class="nav-icon">
            <span class="nav-text">Configuración</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- STAGE ISLA -->
    <main class="stage-island">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
